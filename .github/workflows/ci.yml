name: CI

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 24.9.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lock

      - name: Prepublish
        run: pnpm prepublish

      - run: pnpm dlx pkg-pr-new publish
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lock
      - run: pnpm lint
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lock
      - run: pnpm build
  build-storybook:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lock
      - run: pnpm storybook:build
